<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commons Library</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Kannada:wght@400;700&display=swap">
<style>
:root{--bg:#f2f5f3;--surface:#fff;--ink:#12302f;--muted:#55706d;--line:#cfdad7;--accent:#0f6b63;--accent-ink:#fff;--warn:#b4570a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1b1a;--surface:#162726;--ink:#e6f0ee;--muted:#9bb5b1;--line:#2b4543;--accent:#4cc3b5;--accent-ink:#06221f;--warn:#f0a050;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,"Noto Sans Devanagari","Noto Sans Kannada",system-ui,sans-serif}
h1,h2,h3{font-family:"Young Serif","Noto Sans Devanagari","Noto Sans Kannada",Georgia,serif;font-weight:400;margin:0}
header{background:var(--accent);color:var(--accent-ink);padding:22px 20px 0}
.wrap{max-width:1000px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.2}
header p{margin:6px 0 0;max-width:46ch;opacity:.9}
.me{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.me .btn.alt{color:inherit;border-color:currentColor}
nav{display:flex;gap:4px;margin-top:20px;overflow-x:auto}
nav button{background:transparent;color:inherit;border:0;padding:10px 16px;font:inherit;font-weight:500;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--bg);color:var(--ink)}
main{padding:24px 20px 48px}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px;color:var(--muted)}.stats b{color:var(--ink);font-size:1.3rem}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0}
.tools input[type=search]{flex:1 1 220px}
button.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
button.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.book{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.spine{width:22px;flex:none}
.bd{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.bd h3{font-size:1.05rem;line-height:1.3}.meta{color:var(--muted);font-size:.88rem}
.tag{font-size:.85rem;font-weight:700}.tag.out{color:var(--warn)}.tag.in{color:var(--accent)}
.bd .btn{margin-top:auto;align-self:flex-start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;max-width:520px}
.panel label{display:block;margin:0 0 12px;font-weight:500}.panel input,.panel select{width:100%;margin-top:4px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h2{font-size:1.4rem;margin:0 0 14px}
.empty{color:var(--muted);padding:20px 0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;background:var(--surface)}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--bg);font-weight:700}tr:last-child td{border-bottom:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function head(){var u=S.cur&&me();

(u?'<span>'+t("hello")+', '+esc(u.name)+' ('+t(u.role==="lib"?"librarian":"member")+')</span><button class="btn alt" id="out">'+t("logout")+'</button>':'')+'</div></div>'+
(u?'<nav role="tablist">'+TABS.map(function(k){return'<button role="tab" aria-selected="'+(tab===k)+'" data-t="'+k+'">'+t(k)+'</button>'}).join("")+'</nav>':'<div style="height:24px"></div>');

$("hd").onchange=function(e){if(e.target.id==="lang"){S.lang=e.target.value;save();render()}};

function card(b){var c=COLORS[CATS.indexOf(b.cat)]||COLORS[0],out=!!b.by,r=out&&active(b.id);

function auth(){var reg=mode==="reg";

(reg?'<label>'+t("name")+'<input id="an" maxlength="30"></label>':'')+
'<label>'+t("phone")+'<input id="ap" inputmode="numeric" maxlength="10"></label><label>'+t("pin")+'<input id="apin" type="password" inputmode="numeric" maxlength="4"></label>'+
(reg?'<label>'+t("role")+'<select id="ar"><option value="mem">'+t("member")+'</option><option value="lib">'+t("librarian")+'</option></select></label>':'')+
'<div class="row"><button class="btn" id="ago" type="button">'+t(reg?"register":"login")+'</button><button class="btn alt" id="gg" type="button">'+t("google")+'</button></div></form>'+
'<p class="meta"><a href="#" id="sw">'+t(reg?"haveacc":"noacc")+'</a></p></div>'}

function render(){head();var v=$("view"),h="";
if(!S.cur){v.innerHTML=auth();bind();return}
if(tab==="catalog"){var n=S.books.length,a=S.books.filter(function(b){return!b.by}).length;
var L=S.books.filter(function(b){return(!q||(b.title+b.author).toLowerCase().indexOf(q.toLowerCase())>-1)&&(!cat||b.cat===cat)&&(!avail||!b.by)});
h='<div class="stats"><span><b>'+n+'</b> '+t("books")+'</span><span><b>'+a+'</b> '+t("availnow")+'</span></div><div class="tools"><input id="q" type="search" placeholder="'+t("search")+'" aria-label="'+t("search")+'" value="'+esc(q)+'"><select id="cat" aria-label="'+t("category")+'"><option value="">'+t("allcat")+'</option>'+CATS.map(function(c){return'<option value="'+c+'"'+(c===cat?' selected':'')+'>'+t(c)+'</option>'}).join("")+'</select><label class="meta" style="align-self:center"><input type="checkbox" id="av"'+(avail?' checked':'')+'> '+t("availonly")+'</label></div>'+
(L.length?'<div class="shelf">'+L.map(card).join("")+'</div>':'<div class="empty">'+t("noresults")+'</div>')}
if(tab==="donate"){h='<h2>'+t("donate")+'</h2><form class="panel" onsubmit="return false"><label>'+t("titlef")+'<input id="dt"></label><label>'+t("author")+'<input id="da"></label><div class="row"><label style="flex:1">'+t("category")+'<select id="dc">'+CATS.map(function(c){return'<option value="'+c+'">'+t(c)+'</option>'}).join("")+'</select></label><label style="flex:1">'+t("condition")+'<select id="dd">'+["Good","Fair","Like new"].map(function(c){return'<option value="'+c+'">'+t(c)+'</option>'}).join("")+'</select></label></div><button class="btn" id="dsub" type="button">'+t("add")+'</button></form>'}
if(tab==="exchange"){h='<h2>'+t("offers")+'</h2><div class="list">'+S.offers.map(function(o){return'<div class="item"><div><b>'+esc(o.have)+'</b><div class="meta">'+t("wants")+': '+esc(o.want)+' · '+t("by")+' '+esc(o.by)+'</div></div>'+(o.status==="Open"?(o.ph===S.cur?'<button class="btn alt" data-a="cancel" data-id="'+o.id+'">'+t("withdraw")+'</button>':'<button class="btn" data-a="swap" data-id="'+o.id+'">'+t("reqswap")+'</button>'):'<span class="tag out">'+t("requested")+': '+esc(o.req||"")+'</span>')+'</div>'}).join("")+'</div>'+
'<h2 style="margin-top:28px">'+t("offerbook")+'</h2><form class="panel" onsubmit="return false"><label>'+t("have")+'<input id="eh"></label><label>'+t("want")+'<input id="ew"></label><button class="btn" id="esub" type="button">'+t("post")+'</button></form>'}
if(tab==="records"){var lib=isLib(),rows=(lib?S.records:S.records.filter(function(r){return r.phone===S.cur})).slice().reverse();
h='<h2>'+t(lib?"allrec":"myrec")+'</h2>'+(rows.length?'<div class="tw"><table><thead><tr>'+(lib?'<th>'+t("borrower")+'</th><th>'+t("phone")+'</th>':'')+'<th>'+t("book")+'</th><th>'+t("borrowedon")+'</th><th>'+t("due")+'</th><th>'+t("status")+'</th><th>'+t("action")+'</th></tr></thead><tbody>'+
rows.map(function(r){var st=r.ret?t("returned"):(r.due<Date.now()?t("overdue"):t("borrowed")),late=!r.ret&&r.due<Date.now();
return'<tr>'+(lib?'<td>'+esc(r.name)+'</td><td>'+esc(r.phone)+'</td>':'')+'<td>'+esc(r.title)+'</td><td>'+fmt(r.on)+'</td><td>'+fmt(r.due)+'</td><td'+(late?' style="color:var(--warn);font-weight:700"':'')+'>'+st+'</td><td>'+(!r.ret&&(lib||r.phone===S.cur)?'<button class="btn alt" data-a="return" data-id="'+r.bid+'">'+t("return")+'</button>':'')+'</td></tr>'}).join("")+'</tbody></table></div>':'<div class="empty">'+t("norecords")+'</div>')}
v.innerHTML=h;bind()}

function bind(){var e;
if($("sw"))$("sw").onclick=function(ev){ev.preventDefault();mode=mode==="reg"?"login":"reg";render()};
if($("gg"))$("gg").onclick=function(){toast(t("googlemsg"))};
if($("ago"))$("ago").onclick=function(){var ph=$("ap").value.trim(),pin=$("apin").value;
if(!/^\d{10}$/.test(ph)){toast(t("badphone"));return}
if(!/^\d{4}$/.test(pin)){toast(t("badpin"));return}
if(mode==="reg"){var nm=$("an").value.trim();if(!nm){toast(t("badname"));return}
if(S.users[ph]){toast(t("exists"));return}
S.users[ph]={name:nm,pin:pin,role:$("ar").value}}
else if(!S.users[ph]||S.users[ph].pin!==pin){toast(t("wrong"));return}
S.cur=ph;tab="catalog";save();render()};
if(e=$("q"))e.oninput=function(){q=e.value;var p=e.selectionStart;render();var n=$("q");n.focus();n.setSelectionRange(p,p)};
if(e=$("cat"))e.onchange=function(){cat=e.value;render()};
if(e=$("av"))e.onchange=function(){avail=e.checked;render()};
if($("dsub"))$("dsub").onclick=function(){var ti=$("dt").value.trim(),au=$("da").value.trim();if(!ti||!au){toast(t("tFill"));return}
S.books.unshift({id:S.seq++,title:ti,author:au,cat:$("dc").value,cond:$("dd").value,donor:me().name,by:null});S.donated++;save();tab="catalog";render();toast(t("tDonate"))};
if($("esub"))$("esub").onclick=function(){var h=$("eh").value.trim(),w=$("ew").value.trim();if(!h||!w){toast(t("tFill"));return}
S.offers.unshift({id:S.seq++,have:h,want:w,by:me().name,ph:S.cur,status:"Open"});save();render();toast(t("tPost"))}}

$("view").addEventListener("click",function(e){var a=e.target.dataset.a;if(!a)return;var id=+e.target.dataset.id;
var b=S.books.filter(function(x){return x.id===id})[0],o=S.offers.filter(function(x){return x.id===id})[0];
if(a==="borrow"&&b&&!b.by){var now=Date.now(),due=now+DAYS*864e5;b.by=S.cur;S.records.push({id:S.seq++,bid:b.id,title:b.title,name:me().name,phone:S.cur,on:now,due:due,ret:null});toast(t("tBorrow")+" "+fmt(due))}
if(a==="return"&&b){var r=active(id);if(r)r.ret=Date.now();b.by=null;toast(t("tReturn"))}
if(a==="swap"&&o){o.status="Requested";o.req=me().name;toast(t("tSwap"))}
if(a==="cancel"){S.offers=S.offers.filter(function(x){return x.id!==id})}
save();render()});
render();
</script>
</body>
</html>
